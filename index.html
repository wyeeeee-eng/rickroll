<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内容确认</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui, sans-serif;
}

body{
    background:#000;
    height:100vh;
    overflow:hidden;
    /* 使用本地 picture.png */
    background-image: url('picture.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

#ageMask{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:999;
}

.age-box{
    background:rgba(170,170,170,0.92);
    width:90%;
    max-width:700px;
    padding:40px 24px;
    text-align:center;
    border-radius:10px;
}

.age-box h1{
    font-size:42px;
    color:#000;
    margin-bottom:16px;
}

.age-box p{
    font-size:20px;
    color:#333;
    line-height:1.6;
    margin-bottom:30px;
}

.btn-group{
    display:flex;
    gap:20px;
    justify-content:center;
    flex-wrap:wrap;
}

#adultBtn{
    background:#ff2222;
    color:white;
    border:none;
    font-size:24px;
    padding:18px 40px;
    border-radius:10px;
    cursor:pointer;
}

#kidBtn{
    background:transparent;
    color:#000;
    border:3px solid #000;
    font-size:24px;
    padding:18px 40px;
    border-radius:10px;
    cursor:pointer;
}

#videoWrap{
    display:none;
    width:100vw;
    height:100vh;
}

iframe{
    width:100%;
    height:100%;
    border:0;
}
</style>
</head>
<body>
    <!-- 年龄确认弹窗 -->
    <div id="ageMask">
        <div class="age-box">
            <h1>您是否已满18岁</h1>
            <p>有蓝色大肥鱼色图，我们需要确认您的年龄。<br><br>
            We have blue big fat fish pornographic images, we need to verify your ageirm your age.</p>
            <div class="btn-group">
                <button id="adultBtn">已满18岁</button>
                <button id="kidBtn">未满18岁</button>
            </div>
        </div>
    </div>

    <!-- 视频区域 -->
    <div id="videoWrap">
        <iframe src="https://player.bilibili.com/player.html?bvid=BV1GJ411x7h7"></iframe>
    </div>

<script>
const ageMask = document.getElementById('ageMask');
const videoWrap = document.getElementById('videoWrap');
const adultBtn = document.getElementById('adultBtn');
const kidBtn = document.getElementById('kidBtn');

// 点击已满18
adultBtn.onclick = async ()=>{
    ageMask.style.display = "none";
    videoWrap.style.display = "block";
    try{
        await document.documentElement.requestFullscreen();
    }catch(e){
        console.log("移动端全屏限制，跳过全屏");
    }
};

// 未满18按钮
kidBtn.onclick = ()=>{
    alert("未满18岁禁止访问！");
};
</script>
</body>
</html>
